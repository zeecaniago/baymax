name: CI

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            cli/requirements.txt
            server/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -r cli/requirements.txt
          python -m pip install -r server/requirements.txt

      - name: Prepare CI artifacts
        run: |
          mkdir -p ci-artifacts
          printf 'Coverage reports are uploaded here when the test step completes.\n' > ci-artifacts/README.txt

      - name: Lint
        run: python -m ruff check cli server tests

      - name: Run tests with coverage
        run: |
          python -m pytest tests \
            --cov=cli \
            --cov=server \
            --cov-report=term-missing \
            --cov-report=xml:ci-artifacts/coverage.xml \
            --cov-report=html:ci-artifacts/htmlcov

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ci-artifacts/
