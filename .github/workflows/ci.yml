name: CI

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - closed
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint-and-test:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            cli/requirements.txt
            server/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -r cli/requirements.txt
          python -m pip install -r server/requirements.txt

      - name: Prepare CI artifacts
        run: |
          mkdir -p ci-artifacts
          printf 'Coverage reports are uploaded here when the test step completes.\n' > ci-artifacts/README.txt

      - name: Lint
        run: python -m ruff check cli server tests

      - name: Run tests with coverage
        run: |
          python -m pytest tests \
            --cov=cli \
            --cov=server \
            --cov-report=term-missing \
            --cov-report=xml:ci-artifacts/coverage.xml \
            --cov-report=html:ci-artifacts/htmlcov

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ci-artifacts/

  create-release-tag:
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out merged commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Configure Git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create semantic version tag
        shell: bash
        run: |
          git fetch --tags --force origin

          if git tag --points-at HEAD --list 'v[0-9]*' | grep --extended-regexp --quiet '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "A semantic version tag already points at this commit; skipping tag creation."
            exit 0
          fi

          for attempt in {1..5}; do
            latest_tag="$(git tag --list | grep --extended-regexp '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort --version-sort | tail --lines=1 || true)"

            if [ -z "${latest_tag}" ]; then
              tag_name="v0.1.0"
            else
              IFS=. read -r major minor patch <<< "${latest_tag#v}"
              tag_name="v${major}.${minor}.$((patch + 1))"
            fi

            git tag --annotate "${tag_name}" --message "Release ${tag_name}"
            if git push origin "refs/tags/${tag_name}"; then
              echo "Created ${tag_name}."
              exit 0
            fi

            git tag --delete "${tag_name}"
            git fetch --tags --force origin

            if git tag --points-at HEAD --list 'v[0-9]*' | grep --extended-regexp --quiet '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "Another run already tagged this commit; skipping tag creation."
              exit 0
            fi
          done

          echo "Unable to create a semantic version tag after five attempts." >&2
          exit 1
